openapi: 3.0.3
info:
  title: API
  version: 1.0.0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

definitions:
  CreateProductRequest:
    type: object
    required:
      - product_type_id
      - name
      - description
      - short_description
      - avg_dimensions
      - active
      - is_featured
      - is_new
      - has_variants
      - available_at
    properties:
      product_type_id:
        type: integer
        minimum: 1
        example: 1
      name:
        type: string
        maxLength: 255
        example: "Example product name"
      sku:
        type: string
        maxLength: 255
        example: "SKU-001"
      description:
        type: string
        example: "Full product description"
      short_description:
        type: string
        maxLength: 255
        example: "Short description"
      brand:
        type: string
        maxLength: 255
      model:
        type: string
        maxLength: 255
      attributes:
        type: array
        items: {}
      avg_weight:
        type: number
      avg_dimensions:
        type: object
        required:
          - width
          - height
          - length
          - unit
        properties:
          width:
            type: number
          height:
            type: number
          length:
            type: number
          unit:
            type: string
      total_stock:
        type: integer
      min_stock:
        type: integer
      meta_title:
        type: string
        maxLength: 255
      meta_description:
        type: string
      meta_keywords:
        type: array
        items:
          type: string
      active:
        type: boolean
      is_featured:
        type: boolean
      is_new:
        type: boolean
      has_variants:
        type: boolean
      available_at:
        type: string
        format: date
  ProductCreatedData:
    type: object
    properties:
      id:
        type: integer
        example: 1
      name:
        type: string
      active:
        type: boolean
  ErrorResponse:
    type: object
    properties:
      status:
        type: boolean
        example: false
      message:
        type: string
      errors:
        type: array
        items: {}
        example: []
      data:
        type: array
        items: {}
  UpdateProductRequest:
    type: object
    required:
      - product_type_id
      - name
      - sku
      - description
      - short_description
      - avg_dimensions
      - active
      - is_featured
      - is_new
      - has_variants
      - available_at
    properties:
      product_type_id:
        type: integer
        minimum: 1
        example: 1
      name:
        type: string
        maxLength: 255
        example: "Example product name"
      sku:
        type: string
        maxLength: 255
        example: "SKU-001"
      id:
        type: integer
        description: "Path parameter merged into validation data; provided in URI"
        example: 1
      description:
        type: string
        example: "Full product description"
      short_description:
        type: string
        maxLength: 255
        example: "Short description"
      brand:
        type: string
        maxLength: 255
      model:
        type: string
        maxLength: 255
      attributes:
        type: array
        items: {}
      avg_weight:
        type: number
      avg_dimensions:
        type: object
        required:
          - width
          - height
          - length
          - unit
        properties:
          width:
            type: number
          height:
            type: number
          length:
            type: number
          unit:
            type: string
      total_stock:
        type: integer
      min_stock:
        type: integer
      meta_title:
        type: string
        maxLength: 255
      meta_description:
        type: string
      meta_keywords:
        type: array
        items:
          type: string
      active:
        type: boolean
      is_featured:
        type: boolean
      is_new:
        type: boolean
      has_variants:
        type: boolean
      available_at:
        type: string
        format: date

  AddPriceRequest:
    type: object
    required:
      - base_price
      - currency
    properties:
      base_price:
        type: number
        format: float
        minimum: 0
        example: 99.90
      cost_price:
        type: number
        format: float
        nullable: true
        minimum: 0
        example: 49.50
      profit_margin:
        type: number
        format: float
        nullable: true
        minimum: 0
        example: 50.00
      promotional_price:
        type: number
        format: float
        nullable: true
        minimum: 0
        example: 79.90
      promotional_starts_at:
        type: string
        format: date-time
        nullable: true
        example: "2026-02-11 00:00:00"
      promotional_ends_at:
        type: string
        format: date-time
        nullable: true
        example: "2026-02-28 23:59:59"
      compare_at_price:
        type: number
        format: float
        nullable: true
        minimum: 0
        example: 129.90
      currency:
        type: string
        pattern: "^BRL$"
        example: "BRL"
      tax_rate:
        type: number
        format: float
        nullable: true
        minimum: 0
        example: 5.00
  UpdatePriceRequest:
    type: object
    properties:
      base_price:
        type: number
        format: float
        minimum: 0
        example: 99.90
      cost_price:
        type: number
        format: float
        nullable: true
        minimum: 0
        example: 49.50
      profit_margin:
        type: number
        format: float
        nullable: true
        minimum: 0
        example: 50.00
      promotional_price:
        type: number
        format: float
        nullable: true
        minimum: 0
        example: 79.90
      promotional_starts_at:
        type: string
        format: date-time
        nullable: true
        example: "2026-02-11 00:00:00"
      promotional_ends_at:
        type: string
        format: date-time
        nullable: true
        example: "2026-02-28 23:59:59"
      compare_at_price:
        type: number
        format: float
        nullable: true
        minimum: 0
        example: 129.90
      currency:
        type: string
        pattern: "^BRL$"
        example: "BRL"
      tax_rate:
        type: number
        format: float
        nullable: true
        minimum: 0
        example: 5.00
  PriceData:
    type: object
    properties:
      id:
        type: integer
        example: 1
      product_id:
        type: integer
        example: 1
      base_price:
        type: string
        example: "99.90"
      cost_price:
        type: string
        nullable: true
        example: "49.50"
      profit_margin:
        type: string
        nullable: true
        example: "50.00"
      promotional_price:
        type: string
        nullable: true
        example: "79.90"
      promotional_starts_at:
        type: string
        format: date-time
        nullable: true
        example: "2026-02-11T00:00:00.000000Z"
      promotional_ends_at:
        type: string
        format: date-time
        nullable: true
        example: "2026-02-28T23:59:59.000000Z"
      compare_at_price:
        type: string
        nullable: true
        example: "129.90"
      currency:
        type: string
        example: "BRL"
      tax_rate:
        type: string
        nullable: true
        example: "5.00"
      created_at:
        type: string
        example: "2026-02-11 10:25:12"
      updated_at:
        type: string
        example: "2026-02-11 10:25:12"
  AddProductVariantRequest:
    type: object
    required:
      - sku
      - name
      - barcode
      - variant_type
    properties:
      sku:
        type: string
        maxLength: 255
        example: "SKU-VAR-001"
      name:
        type: string
        maxLength: 255
        example: "Azul - M"
      barcode:
        type: string
        maxLength: 255
        example: "7891234567890"
      variant_type:
        type: string
        enum:
          - clothing
          - electronics
          - furniture
          - books
          - simple
        example: "clothing"
      price_adjustment:
        type: number
        format: float
        nullable: true
        example: 5.00
      stock:
        type: integer
        minimum: 0
        nullable: true
        example: 10
      reserved_stock:
        type: integer
        minimum: 0
        nullable: true
        example: 0
      min_stock:
        type: integer
        minimum: 0
        nullable: true
        example: 1
      weight:
        type: number
        format: float
        nullable: true
        example: 0.50
      dimensions:
        type: object
        nullable: true
        required:
          - altura
          - largura
          - profundidade
        properties:
          altura:
            type: number
            example: 10
          largura:
            type: number
            example: 20
          profundidade:
            type: number
            example: 5
  UpdateProductVariantRequest:
    type: object
    required:
      - sku
      - name
      - barcode
      - variant_type
    properties:
      sku:
        type: string
        maxLength: 255
        example: "SKU-VAR-001"
      name:
        type: string
        maxLength: 255
        example: "Azul - M"
      barcode:
        type: string
        maxLength: 255
        example: "7891234567890"
      variant_type:
        type: string
        enum:
          - clothing
          - electronics
          - furniture
          - books
          - simple
        example: "clothing"
      price_adjustment:
        type: number
        format: float
        nullable: true
        example: 5.00
      stock:
        type: integer
        minimum: 0
        nullable: true
        example: 10
      reserved_stock:
        type: integer
        minimum: 0
        nullable: true
        example: 0
      min_stock:
        type: integer
        minimum: 0
        nullable: true
        example: 1
      weight:
        type: number
        format: float
        nullable: true
        example: 0.50
      dimensions:
        type: object
        nullable: true
        required:
          - altura
          - largura
          - profundidade
        properties:
          altura:
            type: number
            example: 10
          largura:
            type: number
            example: 20
          profundidade:
            type: number
            example: 5
      order:
        type: integer
        minimum: 0
        nullable: true
        example: 1
      active:
        type: boolean
        nullable: true
        example: true
  ProductVariantData:
    type: object
    properties:
      id:
        type: integer
        example: 1
      product_id:
        type: integer
        example: 1
      sku:
        type: string
        example: "SKU-VAR-001"
      name:
        type: string
        nullable: true
        example: "Azul - M"
      barcode:
        type: string
        nullable: true
        example: "7891234567890"
      variant_type:
        type: string
        enum:
          - clothing
          - electronics
          - furniture
          - simple
        example: "clothing"
      price_adjustment:
        type: string
        example: "5.00"
      stock:
        type: integer
        example: 10
      reserved_stock:
        type: integer
        example: 0
      min_stock:
        type: integer
        example: 1
      weight:
        type: string
        nullable: true
        example: "0.50"
      dimensions:
        type: object
        nullable: true
        properties:
          altura:
            type: number
            example: 10
          largura:
            type: number
            example: 20
          profundidade:
            type: number
            example: 5
      image_url:
        type: string
        nullable: true
        example: null
      order:
        type: integer
        example: 0
      active:
        type: boolean
        example: true
      is_default:
        type: boolean
        example: false
      created_at:
        type: string
        example: "2026-02-11 10:25:12"
      updated_at:
        type: string
        example: "2026-02-11 10:25:12"
      deleted_at:
        type: string
        nullable: true
        example: null

paths:
  /api/login:
    post:
      tags:
        - AUTHENTICATION
      summary: Login attempt
      description: Authenticates the user and generates a JWT token for accessing protected API resources.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "test@gmail.com"
                password:
                  type: string
                  format: password
                  example: "123456"
      responses:
        '200':
          description: Token generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Token generated successfully.
                  errors:
                    type: array
                    items: {}
                    example: []
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: >-
                          eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.abc.def.ghi
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 42
                          name:
                            type: string
                            example: "Usuário Exemplo"
                          email:
                            type: string
                            example: "usuario@exemplo.com"
                          email_verified_at:
                            type: string
                            nullable: true
                            example: null
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            example: /api/login
                      logout:
                        type: object
                        properties:
                          href:
                            type: string
                            example: /api/logout
                          method:
                            type: string
                            example: POST
                      get:
                        type: object
                        properties:
                          href:
                            type: string
                            example: /api/user/self
                          method:
                            type: string
                            example: GET
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid credentials."
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                      - "Email and password do not match"
                  data:
                    type: array
                    items: {}
                    example: []
        '422':
          description: Error validating fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Error Processing Request"
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                      - "The email field is required."
                  data:
                    type: array
                    items: {}
                    example: []

  /api/logout:
    post:
      tags:
        - AUTHENTICATION
      summary: Expires your current token, ending the session.
      description: Ends the authenticated user's session, invalidating the current JWT token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Logout successful.
                  errors:
                    type: array
                    items: {}
                    example: []
                  data:
                    type: array
                    items: {}
                    example: []
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/logout
                      login:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/login
                      user:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/user/self

  /api/user/self:
    get:
      tags:
        - AUTHENTICATION
      summary: Retrieves authenticated user's data
      description: Retrieves user data using the generated token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User found successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User found successfully."
                  errors:
                    type: array
                    items: {}
                    example: []
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: "Test"
                      email:
                        type: string
                        example: "test@gmail.com"
                      email_verified_at:
                        type: string
                        nullable: true
                        example: null
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            example: /api/user/self
                      logout:
                        type: object
                        properties:
                          href:
                            type: string
                            example: /api/logout
                          method:
                            type: string
                            example: POST

  #User
  /api/v1/user:
    post:
      tags:
        - USER
      summary: User registration.
      description: Registers a new user in the system.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Test
                email:
                  type: string
                  example: test02@gmail.com
                password:
                  type: string
                  example: Abc123!
      responses:
        '200':
          description: User added successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User added successfully.
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 4
                      user:
                        type: string
                        example: test
                      email:
                        type: string
                        example: test02@gmail.com
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/user/4
                      get:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/user/4
                          method:
                            type: string
                            example: GET
                      update:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/user/4
                          method:
                            type: string
                            example: PUT
                      delete:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/user/4
                          method:
                            type: string
                            example: DELETE
                      status:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/user/4
                          method:
                            type: string
                            example: PATCH
        '409':
          description: Duplicate detected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Duplicate detected.
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                      - Email already registered.
                  data:
                    type: array
                    items: {}
                    example: []
        '422':
          description: Validation error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Error Processing Request
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                      - "The 'name' field is required."
                  data:
                    type: array
                    items: {}
                    example: []

  /api/v1/user/{id}:
    get:
      tags:
        - USER
      summary: Get user.
      description: Get a user by ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID to be retrieved.
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: User found successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User found successfully.
                  errors:
                    type: array
                    items:
                      type: string
                    example: []
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: Test
                      email:
                        type: string
                        example: test@gmail.com
                  _links:
                    type: object
                    properties:
                      self:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/user/1
                      update:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/user/1
                          method:
                            type: string
                            example: PUT
                      delete:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/user/1
                          method:
                            type: string
                            example: DELETE
                      status:
                        type: object
                        properties:
                          href:
                            type: string
                            example: http://127.0.0.1:4001/user/1
                          method:
                            type: string
                            example: PATCH
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: User not found.
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                      - ID not identified
                  data:
                    type: array
                    items: {}
                    example: []
    delete:
      tags:
        - USER
      summary: Delete user
      description: Delete a user by their ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID to be deleted.
          schema:
            type: integer
            minimum: 1
          example: 2
      responses:
        "200":
          description: User deleted successfully.
          content:
            application/json:
              example:
                status: true
                message: "User deleted successfully."
                errors: []
                data: []
                _links:
                  self:
                    href: "http://127.0.0.1:8000/user/2"
        "404":
          description: User not found.
          content:
            application/json:
              example:
                status: false
                message: "User not found."
                errors:
                  - "ID not identified"
                data: []
        "422":
          description: Validation error.
          content:
            application/json:
              example:
                status: false
                message: "Error Processing Request"
                errors:
                  - "Id must be higher than 0."
                data: []
    put:
      tags:
        - USER
      summary: Update user.
      description: Update a user's data by their ID.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID to be updated.
          schema:
            type: integer
            minimum: 1
          example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  example: Teste00
                email:
                  type: string
                  format: email
                  example: teste00@gmail.com
            example:
              name: "Teste00"
              email: "teste00@gmail.com"
      responses:
        "200":
          description: User updated successfully.
          content:
            application/json:
              example:
                status: true
                message: "User updated successfully."
                errors: []
                data:
                  id: "3"
                  name: "teste"
                  email: "teste01@teste.com"
                _links:
                  self:
                    href: "http://127.0.0.1:8000/user/3"
